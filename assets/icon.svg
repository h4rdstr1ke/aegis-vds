<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gradShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="256" height="256" rx="56" fill="url(#gradBg)"/>
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Glowing Aegis Shield -->
  <path d="M128 36 L196 68 C196 140, 168 196, 128 220 C88 196, 60 140, 60 68 Z" 
        fill="url(#gradShield)" 
        filter="url(#glow)"/>

  <!-- Inner Shield Highlight -->
  <path d="M128 52 L180 77 C180 134, 156 182, 128 202 C100 182, 76 134, 76 77 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-opacity="0.35"/>

  <!-- Checkmark / Core Bolt -->
  <path d="M112 128 L124 140 L152 108" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
